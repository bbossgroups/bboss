services:
  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana-synthetic
    ports:
      - "23000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://101.131.4.6:23000
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - /grafana/grafana-monitoring/grafana-storage/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro
    depends_on:
      - prometheus
      - postgres
    networks:
      - grafana-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-synthetic
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /grafana/grafana-monitoring/grafana-storage/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - grafana-network

  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: postgres-synthetic
    ports:
      - "25432:5432"
    environment:
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=grafana
      - POSTGRES_DB=synthetic_data
    volumes:
      - /grafana/grafana-monitoring/grafana-storage/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - grafana-network

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "29091:9091"
    networks:
      - grafana-network

networks:
  grafana-network:
    driver: bridge

